# Include inside the Axio HTTPS server block. The service is loopback-only.
auth_request /_axio_access_check;
error_page 401 = @axio_access_denied;

location = /_axio_access_check {
    internal;
    auth_request off;
    proxy_pass http://127.0.0.1:3018/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Axio-Destination $http_sec_fetch_dest;
    proxy_set_header X-Axio-Mode $http_sec_fetch_mode;
    proxy_set_header X-Axio-Accept $http_accept;
    proxy_set_header X-Axio-Original-Uri $request_uri;
    proxy_set_header X-Axio-Request-Id $request_id;
    proxy_set_header X-Real-IP $remote_addr;
}
location = /access {
    auth_request off;
    proxy_pass http://127.0.0.1:3018;
    proxy_set_header X-Real-IP $remote_addr;
}
location = /access/visit.js {
    auth_request off;
    proxy_pass http://127.0.0.1:3018;
}
location = /access/unlock {
    auth_request off;
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:3018;
    proxy_set_header X-Real-IP $remote_addr;
}
location = /access/lock {
    auth_request off;
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:3018;
    proxy_set_header X-Real-IP $remote_addr;
}
location @axio_access_denied {
    auth_request off;
    rewrite ^ /denied break;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_pass http://127.0.0.1:3018;
    proxy_set_header X-Axio-Original-Uri $request_uri;
    proxy_set_header X-Axio-Original-Method $request_method;
    proxy_set_header X-Real-IP $remote_addr;
}
