name: axio
services:
  axio:
    image: axio:${AXIO_IMAGE_TAG:-local}
    build: .
    init: true
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_PATH: /app/data/axio.sqlite
      TRUST_PROXY: 1
    ports:
      - "127.0.0.1:${AXIO_PORT:-3007}:3001"
    volumes:
      - data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  data:
